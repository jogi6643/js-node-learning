<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript & Node.js</title>
  <meta name="description"
    content="Curated 100 JavaScript and 100 Node.js senior interview topics, deep architectural breakdowns, Hinglish explanations, production examples, and interactive visualizers for 8+ years backend engineers.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">

  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/visualizers.css">
</head>

<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-left">
      <button class="icon-btn mobile-menu-btn" id="btn-mobile-menu" aria-label="Open Navigation Menu">
        <span>☰</span>
      </button>
      <a href="#" class="header-brand">
        <div class="brand-title-wrap">
          <div class="brand-title">
            <span class="highlight-js">JS</span> + <span class="highlight-node">Node.js</span>
          </div>
        </div>
      </a>
    </div>

    <!-- Main Navigation Tabs -->
    <nav class="main-tabs" aria-label="Main Navigation Tabs" id="main-nav-tabs">
      <button class="tab-btn active tab-js" id="tab-btn-js" data-view="js-handbook">
        <span>⚡ JS</span>
        <span class="tab-badge" id="tab-badge-js">24</span>
      </button>
      <button class="tab-btn tab-node" id="tab-btn-node" data-view="node-handbook">
        <span>🟢 Node.js</span>
        <span class="tab-badge" id="tab-badge-node">35</span>
      </button>
      <button class="tab-btn" id="tab-btn-comparisons" data-view="comparisons">
        <span>⚖️ Comparisons</span>
        <span class="tab-badge">10</span>
      </button>
      <button class="tab-btn" id="tab-btn-scenarios" data-view="scenarios">
        <span>🚨 Scenarios</span>
        <span class="tab-badge">6</span>
      </button>
      <button class="tab-btn" id="tab-btn-revision" data-view="revision">
        <span>⚡ Revision</span>
      </button>
      <button class="tab-btn" id="tab-btn-questions" data-view="questions">
        <span>🎯 Questions</span>
        <span class="tab-badge" id="tab-badge-q-count">200</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- English <-> Hinglish Mode Switcher -->
      <button class="lang-toggle-btn" id="btn-lang-toggle" title="Toggle English / Hinglish Explanations">
        <span>🌐</span>
        <span class="lang-indicator">
          <span class="lang-tag inactive" id="lang-tag-en">EN</span>
          <span class="lang-tag active" id="lang-tag-hi">HINGLISH</span>
        </span>
      </button>

      <!-- Practice Shortcuts -->
      <button class="btn-nav-pill highlight" id="btn-nav-mock" title="Start Mock Interview Simulator">
        <span>🎙️ Mock</span>
      </button>
      <button class="btn-nav-pill" id="btn-nav-quiz" title="Take Senior MCQ Quiz">
        <span>📝 Quiz</span>
      </button>

      <!-- Theme Switcher -->
      <button class="icon-btn" id="btn-theme-toggle" title="Toggle Dark/Light Mode">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Mobile Backdrop Overlay -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- App Layout -->
  <div class="app-container">

    <!-- Sidebar Navigation & Table of Contents -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-mobile-title-bar">
          <span style="font-weight: 800; font-size: 0.95rem; color: var(--text-primary);">Table of Contents</span>
          <button class="icon-btn btn-close-sidebar" id="btn-close-sidebar" aria-label="Close Sidebar">✕</button>
        </div>
        <div class="sidebar-search-box">
          <span class="sidebar-search-icon">🔍</span>
          <input type="text" class="sidebar-search-input" id="sidebar-search-input"
            placeholder="Search topic (e.g. Closure, Event loop)..." />
        </div>
      </div>

      <div class="filter-category-title" id="sidebar-section-title" style="margin-left: 1.25rem;">Table of Contents
      </div>
      <div class="category-filter-list" id="sidebar-category-list">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- Main Content Stream -->
    <main class="app-main">

      <!-- Chapter Navigation Control Bar (Super Easy Direct Nav) -->
      <section class="chapter-nav-bar" id="chapter-nav-bar">
        <div class="chapter-nav-left">
          <button class="nav-step-btn" id="nav-btn-prev" title="Previous Topic (Shortcut: Left Arrow ←)">
            <span>← Prev</span>
          </button>

          <div class="chapter-dropdown-wrapper">
            <span class="chapter-dropdown-icon">📖</span>
            <select class="chapter-dropdown-select" id="chapter-dropdown-select" aria-label="Jump directly to topic">
              <!-- Dynamically populated -->
            </select>
          </div>

          <button class="nav-step-btn" id="nav-btn-next" title="Next Topic (Shortcut: Right Arrow →)">
            <span>Next →</span>
          </button>

          <span class="chapter-counter-pill" id="chapter-counter-pill">Topic 1 of 24</span>
        </div>

        <div class="chapter-nav-right">
          <!-- Quick Search -->
          <div class="chapter-search-box">
            <span style="opacity: 0.65;">🔍</span>
            <input type="text" id="main-search-input" placeholder="Quick search..." />
          </div>

          <!-- Reading Mode Switcher: Single Topic Focus vs View All -->
          <div class="view-mode-toggle" id="view-mode-toggle-group">
            <button class="view-mode-btn active" id="btn-mode-single" title="Read one topic at a time like a book">📖
              Single</button>
            <button class="view-mode-btn" id="btn-mode-all" title="View all topics in one scrollable page">📜
              All</button>
          </div>

          <button class="btn-cta btn-cta-secondary" id="hero-btn-toggle-viz"
            style="font-size: 0.8rem; padding: 0.38rem 0.75rem;">⚡ Event Loop Lab</button>
        </div>
      </section>

      <!-- Collapsible Interactive Learning Hub: Event Loop & Architecture -->
      <div class="collapsible-viz-box" id="collapsible-viz-container" style="display: none;">
        <div class="collapsible-viz-header" id="collapsible-viz-header">
          <div
            style="display: flex; align-items: center; gap: 0.6rem; font-weight: 700; font-size: 0.92rem; color: #38bdf8;">
            <span>⚡ Interactive Event Loop & Architecture Lab</span>
          </div>
          <span id="collapsible-viz-arrow" style="font-size: 0.85rem; color: var(--text-muted);">✕ Close Lab</span>
        </div>
        <div class="collapsible-viz-content" id="collapsible-viz-body">
          <section id="event-loop-viz-container"></section>
          <section id="system-diagrams-viz-container"></section>
        </div>
      </div>

      <!-- Main Dynamic Content List -->
      <div class="questions-list" id="questions-list-container">
        <!-- Injected via JavaScript -->
      </div>

    </main>
  </div>

  <!-- Mobile Floating Bottom Bar for One-Thumb Chapter Navigation -->
  <div class="mobile-bottom-nav" id="mobile-bottom-nav">
    <button class="mobile-nav-arrow" id="mobile-btn-prev" title="Previous Topic">← Prev</button>
    <button class="mobile-nav-toc" id="mobile-btn-toc" title="Open Chapter Table of Contents">
      <span id="mobile-toc-label" style="font-weight: 800;">📖 Topic 1 of 24</span>
      <span style="font-size: 0.68rem; opacity: 0.75;">Tap to browse list ▾</span>
    </button>
    <button class="mobile-nav-arrow" id="mobile-btn-next" title="Next Topic">Next →</button>
  </div>

  <!-- Practice / Quiz / Scenarios Modal Window -->
  <div class="modal-backdrop" id="practice-modal">
    <div class="modal-window">
      <div class="modal-header">
        <div class="modal-title" id="practice-modal-title">Practice Center</div>
        <button class="btn-close-modal" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body" id="practice-modal-body">
        <!-- Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Universal Scripts: 100% works on both file:// (double-click) and http:// (GitHub Pages) -->
  <script src="./js/data/handbook-topics.js"></script>
  <script src="./js/data/comparisons.js"></script>
  <script src="./js/data/senior-scenarios.js"></script>
  <script src="./js/data/quick-revision.js"></script>
  <script src="./js/data/js-questions.js"></script>
  <script src="./js/data/node-questions.js"></script>
  <script src="./js/bundle.js"></script>
  <script>
    function startApp() {
      if (window.InterviewApp && !window.app) {
        window.app = new window.InterviewApp();
        window.app.init();
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>

</html>
